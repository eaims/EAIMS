name: EAIMS Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: pip install -e '.[test]'
      - name: Pre-push/repository audit
        run: python tools/prepush_audit.py
      - name: Validate canonical specification
        run: eaims-validate
      - name: Run executable tests
        run: PYTHONPATH=. pytest -q
      - name: CLI smoke test
        run: |
          eaims validate-fixture reference-implementations/ri-01-api-consumed-analytics/input/fixture.yaml
          eaims assess reference-implementations/ri-01-api-consumed-analytics/input/fixture.yaml --out /tmp/eaims-ri01
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Standalone wheel smoke test outside repository
        run: |
          python -m venv /tmp/eaims-wheel-venv
          /tmp/eaims-wheel-venv/bin/pip install dist/*.whl
          cd /tmp
          /tmp/eaims-wheel-venv/bin/python -c "import eaims; from importlib.metadata import version; assert eaims.__version__ == version('eaims')"
          /tmp/eaims-wheel-venv/bin/eaims-validate
          /tmp/eaims-wheel-venv/bin/eaims validate-fixture "$GITHUB_WORKSPACE/reference-implementations/ri-01-api-consumed-analytics/input/fixture.yaml"
          /tmp/eaims-wheel-venv/bin/eaims assess "$GITHUB_WORKSPACE/reference-implementations/ri-01-api-consumed-analytics/input/fixture.yaml" --out /tmp/eaims-wheel-ri01
          /tmp/eaims-wheel-venv/bin/eaims review summarize "$GITHUB_WORKSPACE/validation/review-workflow-fixture.yaml" --out /tmp/eaims-wheel-review --fail-on-unmet
      - name: Dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit
      - name: Generate Python dependency SBOM
        run: |
          python -m pip install cyclonedx-bom
          mkdir -p validation/runtime-ci
          cyclonedx-py environment --output-format JSON --output-file validation/runtime-ci/python-sbom.cdx.json
      - name: Docker build smoke test
        run: docker build -f Dockerfile.validator -t eaims-fc16 .
      - name: Docker image runtime validation
        run: docker run --rm --read-only --tmpfs /tmp eaims-fc16
      - name: Docker Compose config validation
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.reference.yml config
      - name: Docker Compose minimal runtime validation
        run: docker compose -f docker-compose.yml up --build --abort-on-container-exit --exit-code-from validator
      - name: Docker Compose reference runtime validation
        run: docker compose -f docker-compose.reference.yml run --build --rm reference-runner
      - name: Capture container runtime evidence
        run: |
          mkdir -p validation/runtime-ci
          docker image inspect eaims-fc16 --format '{{.Id}}' > validation/runtime-ci/container-image-id.txt
          docker version > validation/runtime-ci/docker-version.txt
          docker compose version > validation/runtime-ci/compose-version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: eaims-runtime-validation-evidence
          path: validation/runtime-ci/
      - name: Preserve tested release wheel
        uses: actions/upload-artifact@v4
        with:
          name: eaims-tested-wheel
          path: dist/*.whl
          if-no-files-found: error

  release:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: eaims-release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: eaims-tested-wheel
          path: dist
      - name: Compute wheel checksums
        working-directory: dist
        run: sha256sum *.whl > SHA256SUMS
      - name: Publish validated version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(cat VERSION)"
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_tag="v${release_version}"
          release_notes="RELEASE-NOTES-${release_tag}.md"
          test -f "$release_notes"
          test -f "dist/eaims-${release_version}-py3-none-any.whl"
          if existing_sha="$(gh api "repos/${GH_REPO}/git/ref/tags/${release_tag}" --jq '.object.sha' 2>/dev/null)"; then
            test "$existing_sha" = "$GITHUB_SHA"
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release already exists at this validated commit."
            exit 0
          fi
          gh release create "$release_tag" \
            --target "$GITHUB_SHA" \
            --title "EAIMS ${release_version}" \
            --notes-file "$release_notes" \
            "dist/eaims-${release_version}-py3-none-any.whl" dist/SHA256SUMS
