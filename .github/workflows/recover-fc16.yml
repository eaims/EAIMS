name: Recover FC16 bootstrap ordering
on:
  push:
    branches: [release/eaims-1.0-rc1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover valid bootstrap ordering
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/v1.0.0-rc.1:refs/remotes/origin/fc16-source
          base=(00 01 02 03 04 05 06 07 08 09 10 11)
          found=0
          for pos in $(seq 0 12); do
            order=()
            for i in $(seq 0 12); do
              if [ "$i" -eq "$pos" ]; then order+=(05a); fi
              if [ "$i" -lt 12 ]; then order+=("${base[$i]}"); fi
            done
            : >/tmp/raw
            for p in "${order[@]}"; do
              git show "origin/fc16-source:_fc16_bootstrap/fc16.tar.xz.b64.$p" >>/tmp/raw
            done
            tr -d '\r\n\t ' </tmp/raw >/tmp/payload.b64
            if base64 --decode /tmp/payload.b64 >/tmp/payload.tar.xz 2>/dev/null && xz -t /tmp/payload.tar.xz 2>/dev/null; then
              echo "VALID_ORDER=${order[*]}"
              sha256sum /tmp/payload.tar.xz
              mkdir -p /tmp/extract
              tar -xJf /tmp/payload.tar.xz -C /tmp/extract
              find /tmp/extract -maxdepth 2 -type f | head -30
              found=1
              break
            fi
          done
          test "$found" -eq 1
