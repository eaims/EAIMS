name: Materialize EAIMS 1.0 FC16 controlled integration

on:
  push:
    branches:
      - release/eaims-1.0-rc1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message || '', '[materialized-fc16]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/eaims-1.0-rc1

      - name: Configure project commit identity
        run: |
          git config user.name "eaims"
          git config user.email "elias@eaims.org"

      - name: Record preserved public API hashes
        run: |
          test -f src/eaims/scoring.py
          test -f src/eaims/reporting.py
          sha256sum src/eaims/scoring.py > /tmp/scoring.before
          sha256sum src/eaims/reporting.py > /tmp/reporting.before

      - name: Reconstruct FC16 pre-push base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/v1.0.0-rc.1:refs/remotes/origin/fc16-source
          : > /tmp/fc16-prepush.b64
          for part in 00 01 02 03 04 05 05a 06 07 08 09 10 11; do
            git show "origin/fc16-source:_fc16_bootstrap/fc16.tar.xz.b64.${part}" >> /tmp/fc16-prepush.b64
          done
          base64 -d /tmp/fc16-prepush.b64 > /tmp/fc16-prepush.tar.xz
          xz -t /tmp/fc16-prepush.tar.xz
          mkdir -p /tmp/fc16-candidate
          tar -xJf /tmp/fc16-prepush.tar.xz -C /tmp/fc16-candidate
          test -f /tmp/fc16-candidate/spec/core.yaml
          test -f /tmp/fc16-candidate/src/eaims/cli.py

      - name: Apply reviewed owner overlay
        shell: bash
        run: |
          set -euo pipefail
          cat _integration/fc16-overlay.b64.* > /tmp/fc16-overlay.b64
          base64 -d /tmp/fc16-overlay.b64 > /tmp/fc16-overlay.tar.xz
          xz -t /tmp/fc16-overlay.tar.xz
          tar -xJf /tmp/fc16-overlay.tar.xz -C /tmp/fc16-candidate
          test -f /tmp/fc16-candidate/CLA.md
          test -f /tmp/fc16-candidate/COPYRIGHT-ASSIGNMENT.md
          test -f /tmp/fc16-candidate/tests/test_legal_ip_governance.py

      - name: Path-based merge into current repository
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.git/' /tmp/fc16-candidate/ ./
          test -f src/eaims/scoring.py
          test -f src/eaims/reporting.py
          sha256sum -c /tmp/scoring.before
          sha256sum -c /tmp/reporting.before

      - name: Remove staging and materializer artifacts
        run: |
          rm -rf _integration
          rm -f .github/workflows/materialize-fc16.yml

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run repository and legal audits
        run: |
          python tools/prepush_audit.py
          python tools/legal_ip_governance_audit.py
          eaims-validate

      - name: Run full executable tests
        run: pytest -q

      - name: Verify preserved Python public APIs
        shell: bash
        run: |
          PYTHONPATH=src python - <<'PY'
          import eaims.scoring as scoring
          import eaims.reporting as reporting
          assert callable(scoring.validate_assessment)
          assert callable(scoring.score_assessment)
          assert callable(reporting.markdown_report)
          assert callable(reporting.html_report)
          print('legacy public Python APIs: PASS')
          PY

      - name: Verify legacy CLI compatibility
        shell: bash
        run: |
          test -f examples/fictional-manufacturer.assessment.json
          eaims validate examples/fictional-manufacturer.assessment.json
          eaims score examples/fictional-manufacturer.assessment.json > /tmp/legacy-score.json
          eaims report examples/fictional-manufacturer.assessment.json --format markdown --output /tmp/legacy-report.md
          test -s /tmp/legacy-score.json
          test -s /tmp/legacy-report.md

      - name: Repository hygiene gate
        shell: bash
        run: |
          set -euo pipefail
          find . -type d \( -name __pycache__ -o -name .pytest_cache -o -name .mypy_cache -o -name .ruff_cache -o -name .tox -o -name .nox -o -name build -o -name dist \) -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          find . -type d -name '*.egg-info' -prune -exec rm -rf {} +
          test ! -e _integration
          if find . -type d \( -name __pycache__ -o -name .pytest_cache -o -name build -o -name dist \) -print -quit | grep -q .; then exit 1; fi
          if find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -print -quit | grep -q .; then exit 1; fi

      - name: Commit controlled path-based integration
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          test -f src/eaims/scoring.py
          test -f src/eaims/reporting.py
          if git diff --cached --name-status | grep -E '^D[[:space:]]+src/eaims/(scoring|reporting)\.py$'; then
            echo 'ERROR: preserved public API file scheduled for deletion'
            exit 1
          fi
          git status --short
          git commit -m "spec: integrate EAIMS 1.0 FC16 release candidate [materialized-fc16]" -m "Controlled path-based merge; preserves legacy public Python APIs." -m "Signed-off-by: Elias Naserkhaki <elias@eaims.org>"
          git push origin HEAD:release/eaims-1.0-rc1
