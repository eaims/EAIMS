name: Materialize verified FC16 direct payload

on:
  push:
    branches: [release/eaims-1.0-rc1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message || '', '[materialized-fc16]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/eaims-1.0-rc1

      - name: Configure identity
        run: |
          git config user.name "eaims"
          git config user.email "elias@eaims.org"

      - name: Record preserved legacy assets
        run: |
          test -f src/eaims/scoring.py
          test -f src/eaims/reporting.py
          test -f Dockerfile
          sha256sum src/eaims/scoring.py > /tmp/scoring.before
          sha256sum src/eaims/reporting.py > /tmp/reporting.before
          sha256sum Dockerfile > /tmp/dockerfile.before

      - name: Reconstruct and verify clean FC16 payload
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/fc16-direct.b64
          for p in $(seq -w 0 12); do
            f="_integration/fc16-direct.parts/part-$p"
            test -s "$f"
            cat "$f" >> /tmp/fc16-direct.b64
          done
          tr -d '\r\n\t ' < /tmp/fc16-direct.b64 > /tmp/fc16-direct.compact.b64
          base64 --decode /tmp/fc16-direct.compact.b64 > /tmp/fc16-direct.tar.xz
          echo "2bbdee0196b8ac84946ade1b5b6419af6b1de0488d3f5f87225198f32e5d2f58  /tmp/fc16-direct.tar.xz" | sha256sum -c -
          xz -t /tmp/fc16-direct.tar.xz
          mkdir -p /tmp/fc16-candidate
          tar -xJf /tmp/fc16-direct.tar.xz -C /tmp/fc16-candidate
          test -f /tmp/fc16-candidate/spec/core.yaml
          test -f /tmp/fc16-candidate/CLA.md
          test -f /tmp/fc16-candidate/Dockerfile.validator

      - name: Controlled path-based materialization
        shell: bash
        run: |
          set -euo pipefail
          rsync -a \
            --exclude='.git/' \
            --exclude='src/eaims/scoring.py' \
            --exclude='src/eaims/reporting.py' \
            --exclude='Dockerfile' \
            /tmp/fc16-candidate/ ./

          sha256sum -c /tmp/scoring.before
          sha256sum -c /tmp/reporting.before
          sha256sum -c /tmp/dockerfile.before

          cat > src/eaims/__init__.py <<'PY'
          """EAIMS executable reference package."""

          __version__ = "1.0.0.dev16"
          SPEC_VERSION = "1.0.0-fc16"

          # Backward-compatible public API retained from v0.2.1.
          from .scoring import AssessmentError, score_assessment, validate_assessment
          from .reporting import html_report, markdown_report

          __all__ = [
              "AssessmentError",
              "validate_assessment",
              "score_assessment",
              "markdown_report",
              "html_report",
              "SPEC_VERSION",
          ]
          PY

          printf '%s\n' '1.0.0-rc.1-candidate' > VERSION
          rm -f manifest.json

          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/validate.yml')
          s = p.read_text()
          s = s.replace('run: pytest -q', 'run: PYTHONPATH=. pytest -q')
          s = s.replace('docker build -t eaims-fc16 .', 'docker build -f Dockerfile.validator -t eaims-fc16 .')
          p.write_text(s)
          PY

          rm -rf _integration
          rm -f .github/workflows/materialize-fc16-direct.yml

      - name: Install and run release gates before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[test]'
          python tools/prepush_audit.py
          python tools/legal_ip_governance_audit.py
          eaims-validate
          PYTHONPATH=. pytest -q

      - name: Compatibility gates
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python - <<'PY'
          import eaims
          import eaims.scoring as scoring
          import eaims.reporting as reporting
          assert eaims.__version__ == '1.0.0.dev16'
          assert eaims.SPEC_VERSION == '1.0.0-fc16'
          assert callable(scoring.validate_assessment)
          assert callable(scoring.score_assessment)
          assert callable(reporting.markdown_report)
          assert callable(reporting.html_report)
          print('public Python API compatibility: PASS')
          PY
          eaims validate examples/fictional-manufacturer.assessment.json
          eaims score examples/fictional-manufacturer.assessment.json > /tmp/legacy-score.json
          eaims report examples/fictional-manufacturer.assessment.json --format markdown --output /tmp/legacy-report.md
          test -s /tmp/legacy-score.json
          test -s /tmp/legacy-report.md

      - name: Hygiene and ownership guard
        shell: bash
        run: |
          set -euo pipefail
          test ! -e _integration
          test ! -e manifest.json
          test -f Dockerfile
          test -f Dockerfile.validator
          sha256sum -c /tmp/scoring.before
          sha256sum -c /tmp/reporting.before
          sha256sum -c /tmp/dockerfile.before
          git diff --check
          ! git diff --name-status | grep -E '^D[[:space:]]+src/eaims/(scoring|reporting)\.py$'

      - name: Commit materialized candidate to release branch only
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "spec: materialize verified EAIMS 1.0 FC16 candidate [materialized-fc16]" -m "Preserves v0.2.1 public Python APIs and browser Dockerfile; stages v1 validator separately." -m "Signed-off-by: Elias Naserkhaki <elias@eaims.org>"
          git push origin HEAD:release/eaims-1.0-rc1
