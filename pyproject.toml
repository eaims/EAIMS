[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eaims"
version = "0.2.0"
description = "Reference implementation of the Enterprise AI Maturity Standard"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Elias Naserkhaki"}]
dependencies = []

[project.scripts]
eaims = "eaims.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
