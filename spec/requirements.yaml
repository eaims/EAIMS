spec_version: 1.0.0-fc16
status: freeze_candidate_fc16
requirement_count: 206
requirements:
- requirement_id: EAIMS-STR-001
  capability_id: STR-01
  title: Documented AI Objectives
  normative_level: SHALL
  statement: The organization shall maintain explicit objectives for the use of AI
    that are traceable to enterprise priorities.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-STR-002
  capability_id: STR-01
  title: Business Outcome Alignment
  normative_level: SHALL
  statement: Material AI objectives shall be linked to identifiable business or mission
    outcomes.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-STR-003
  capability_id: STR-01
  title: Strategic Assumptions
  normative_level: SHOULD
  statement: The AI strategy should state material assumptions concerning value, risk,
    capability, dependencies, and constraints.
  criticality: normal
  machine_verifiability: MV4
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-STR-004
  capability_id: STR-01
  title: Strategy Review Triggers
  normative_level: SHALL
  statement: The AI strategy shall be reviewed periodically and after material changes
    in enterprise priorities, risk, technology, or realized value.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-STR-005
  capability_id: STR-01
  title: Strategic Conflict Resolution
  normative_level: SHALL
  statement: Material conflicts among AI initiatives shall have an explicit enterprise-level
    resolution mechanism.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-OWN-001
  capability_id: STR-02
  title: Executive AI Ownership
  normative_level: SHALL
  statement: Enterprise AI accountability shall be assigned to a named executive role
    or governing authority.
  criticality: critical
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-OWN-002
  capability_id: STR-02
  title: Decision Rights
  normative_level: SHALL
  statement: Decision rights across business, technology, and control functions shall
    be explicitly defined for material AI activities.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-OWN-003
  capability_id: STR-02
  title: Risk Escalation
  normative_level: SHALL
  statement: Unresolved material AI risks shall have a documented escalation path
    to an authorized decision-maker.
  criticality: critical
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-OWN-004
  capability_id: STR-02
  title: Executive Portfolio Review
  normative_level: SHALL
  statement: Executive governance shall periodically review material AI portfolio
    value, risk, incidents, and capability gaps.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-OWN-005
  capability_id: STR-02
  title: Residual Risk Acceptance
  normative_level: SHALL
  statement: Acceptance of material residual AI risk shall be traceable to a named
    authority with appropriate decision rights.
  criticality: critical
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-TGT-001
  capability_id: STR-03
  title: Current State
  normative_level: SHALL
  statement: The organization shall document the current maturity state for the scope
    used to define an AI transformation roadmap.
  criticality: normal
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-TGT-002
  capability_id: STR-03
  title: Context Appropriate Target
  normative_level: SHALL
  statement: Target maturity and autonomy shall be selected according to context and
    shall not default to the maximum available level.
  criticality: material
  machine_verifiability: MV4
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-TGT-003
  capability_id: STR-03
  title: Roadmap Ownership
  normative_level: SHALL
  statement: Material roadmap actions shall identify owners, dependencies, intended
    outcomes, and sequencing or timing.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-TGT-004
  capability_id: STR-03
  title: Roadmap Monitoring
  normative_level: SHALL
  statement: Roadmap progress shall be reviewed against capability improvement, outcomes,
    dependencies, and risk reduction.
  criticality: normal
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-TGT-005
  capability_id: STR-03
  title: Target Recalibration
  normative_level: SHALL
  statement: Target states shall be reconsidered when material evidence, value, risk,
    autonomy, or enterprise priorities change.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-INV-001
  capability_id: STR-04
  title: Investment Rationale
  normative_level: SHALL
  statement: Material AI investments shall have a documented strategic and business
    rationale.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-INV-002
  capability_id: STR-04
  title: Investment Criteria
  normative_level: SHALL
  statement: Material AI investments shall be evaluated against defined value, risk,
    feasibility, dependencies, and strategic-fit criteria.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-INV-003
  capability_id: STR-04
  title: Portfolio Duplication Review
  normative_level: SHOULD
  statement: Duplicative or competing AI investments should be reviewed at portfolio
    level.
  criticality: normal
  machine_verifiability: MV4
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-INV-004
  capability_id: STR-04
  title: Continuation Evidence
  normative_level: SHOULD
  statement: Continued material funding should be linked to milestones, outcomes,
    evidence, and unresolved risk.
  criticality: normal
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-INV-005
  capability_id: STR-04
  title: Stop or Redirect
  normative_level: SHOULD
  statement: The governance process should support stopping, reducing, or redirecting
    initiatives whose evidence no longer supports continued investment.
  criticality: normal
  machine_verifiability: MV4
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-OPP-001
  capability_id: VAL-01
  title: Opportunity Process
  normative_level: SHALL
  statement: The organization shall maintain a repeatable mechanism for identifying
    and qualifying material AI opportunities.
  criticality: normal
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-OPP-002
  capability_id: VAL-01
  title: Problem First
  normative_level: SHOULD
  statement: AI opportunities should begin from a business or mission problem rather
    than technology availability alone.
  criticality: normal
  machine_verifiability: MV4
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-OPP-003
  capability_id: VAL-01
  title: Opportunity Record
  normative_level: SHOULD
  statement: Material opportunity records should include an intended outcome, owner,
    affected process, and key constraints.
  criticality: normal
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-OPP-004
  capability_id: VAL-01
  title: No-AI Option
  normative_level: SHALL_NOT
  statement: The organization shall not assume that AI is the preferred solution without
    considering non-AI alternatives where material.
  criticality: material
  machine_verifiability: MV4
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-OPP-005
  capability_id: VAL-01
  title: Rejected Opportunity Rationale
  normative_level: MAY
  statement: Rejected material opportunities may retain the decision rationale for
    future learning.
  criticality: normal
  machine_verifiability: MV4
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-PRI-001
  capability_id: VAL-02
  title: Defined Prioritization Criteria
  normative_level: SHALL
  statement: Material AI use cases shall be prioritized using defined criteria.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-PRI-002
  capability_id: VAL-02
  title: Value and Feasibility
  normative_level: SHALL
  statement: Prioritization shall consider expected value and feasibility.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-PRI-003
  capability_id: VAL-02
  title: Risk and Readiness
  normative_level: SHALL
  statement: Prioritization shall consider data readiness, material risk, dependencies,
    and autonomy implications where applicable.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-PRI-004
  capability_id: VAL-02
  title: No Single-Factor Prioritization
  normative_level: SHALL_NOT
  statement: Material use cases shall not be prioritized solely by technical feasibility,
    vendor availability, or executive preference.
  criticality: material
  machine_verifiability: MV4
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-PRI-005
  capability_id: VAL-02
  title: Portfolio Recalibration
  normative_level: SHOULD
  statement: Prioritization should be recalibrated using realized value, delivery
    performance, cost, risk, and evidence quality.
  criticality: normal
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-PIL-001
  capability_id: VAL-03
  title: Pilot Hypothesis
  normative_level: SHALL
  statement: Each material AI pilot shall define a business or mission hypothesis.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-PIL-002
  capability_id: VAL-03
  title: Success Criteria
  normative_level: SHALL
  statement: Material pilot success criteria shall be defined before the scale decision.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-PIL-003
  capability_id: VAL-03
  title: Baseline
  normative_level: SHALL
  statement: A relevant baseline shall be recorded for material pilots where outcome
    improvement is claimed.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-PIL-004
  capability_id: VAL-03
  title: Pilot Owner
  normative_level: SHALL
  statement: Each material pilot shall have a named owner accountable for the pilot
    outcome.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-PIL-005
  capability_id: VAL-03
  title: Pilot Risk and Autonomy
  normative_level: SHALL
  statement: Material pilots shall classify applicable impact, risk, and autonomy
    before material deployment or scale.
  criticality: critical
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-PIL-006
  capability_id: VAL-03
  title: Pilot HAB
  normative_level: SHALL
  statement: Material pilot decisions subject to human accountability requirements
    shall define the applicable Human Accountability Boundary.
  criticality: critical
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-PIL-007
  capability_id: VAL-03
  title: Scale Criteria
  normative_level: SHALL
  statement: Scale, stop, redesign, extend, or hold criteria shall be defined before
    a material scale decision.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-PIL-008
  capability_id: VAL-03
  title: Explicit Pilot Outcome
  normative_level: SHALL
  statement: A completed material pilot shall record an explicit SCALE, EXTEND, REDESIGN,
    HOLD, or STOP decision.
  criticality: material
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-PIL-009
  capability_id: VAL-03
  title: Evidence-backed Scale
  normative_level: SHALL
  statement: Material scale decisions shall be supported by retained evidence.
  criticality: critical
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-VAL-001
  capability_id: VAL-04
  title: Expected Value
  normative_level: SHALL
  statement: Expected material value shall be documented before scale.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-VAL-002
  capability_id: VAL-04
  title: Baseline and KPI
  normative_level: SHALL
  statement: Material value claims shall have a baseline and defined outcome measures.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-VAL-003
  capability_id: VAL-04
  title: Value Owner
  normative_level: SHALL
  statement: A named business or mission owner shall be accountable for material value
    realization.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-VAL-004
  capability_id: VAL-04
  title: Total Cost
  normative_level: SHOULD
  statement: Total cost should include material model, infrastructure, people, integration,
    governance, and assurance costs.
  criticality: normal
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-VAL-005
  capability_id: VAL-04
  title: Realized Value
  normative_level: SHALL
  statement: Realized value shall be measured after material deployment over an appropriate
    period.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-VAL-006
  capability_id: VAL-04
  title: Portfolio Optimization
  normative_level: SHOULD
  statement: Portfolio decisions should be updated using realized risk-adjusted value
    and material unintended effects.
  criticality: normal
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-DGO-001
  capability_id: DAT-01
  title: Data Owner
  normative_level: SHALL
  statement: Material AI data assets shall have defined ownership or stewardship.
  criticality: material
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-DGO-002
  capability_id: DAT-01
  title: Usage Authority
  normative_level: SHALL
  statement: Authority to use material data for the intended AI purpose shall be demonstrable.
  criticality: critical
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-DGO-003
  capability_id: DAT-01
  title: Data Dependencies
  normative_level: SHALL
  statement: Material AI data dependencies shall be traceable at a level sufficient
    for change and incident analysis.
  criticality: material
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-DGO-004
  capability_id: DAT-01
  title: Access Control
  normative_level: SHALL
  statement: Access controls shall be proportionate to data sensitivity and intended
    use.
  criticality: critical
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-DGO-005
  capability_id: DAT-01
  title: Ownership Gaps
  normative_level: SHALL
  statement: Unresolved material ownership or stewardship gaps shall be recorded as
    assessment findings.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-DQF-001
  capability_id: DAT-02
  title: Fitness Criteria
  normative_level: SHALL
  statement: Material AI systems shall define context-specific criteria for data fitness
    for the intended purpose.
  criticality: material
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-DQF-002
  capability_id: DAT-02
  title: Known Defects
  normative_level: SHALL
  statement: Known material data defects and limitations shall be recorded.
  criticality: material
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-DQF-003
  capability_id: DAT-02
  title: Quality Thresholds
  normative_level: SHOULD
  statement: Material data quality thresholds should be defined before production
    use where practical.
  criticality: normal
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-DQF-004
  capability_id: DAT-02
  title: Upstream Change Trigger
  normative_level: SHALL
  statement: Material upstream data or schema changes shall trigger appropriate data-fitness
    reassessment.
  criticality: material
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-DQF-005
  capability_id: DAT-02
  title: Operational Feedback
  normative_level: SHALL
  statement: Material production data failures shall feed monitoring, incident, or
    remediation processes.
  criticality: material
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-CTX-001
  capability_id: DAT-03
  title: Context Source Inventory
  normative_level: SHALL
  statement: Material contextual sources used by an AI system shall be identifiable.
  criticality: material
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-CTX-002
  capability_id: DAT-03
  title: Context Versioning
  normative_level: SHOULD
  statement: Material context assembly logic and configuration should be version controlled.
  criticality: normal
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-CTX-003
  capability_id: DAT-03
  title: Permission Preservation
  normative_level: SHALL
  statement: Context generation and retrieval shall preserve applicable access and
    usage restrictions.
  criticality: critical
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-CTX-004
  capability_id: DAT-03
  title: Context Evaluation
  normative_level: SHOULD
  statement: Material retrieval and context quality should be evaluated for intended
    use.
  criticality: normal
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-CTX-005
  capability_id: DAT-03
  title: Knowledge Freshness and Conflict
  normative_level: SHALL
  statement: Material stale or conflicting knowledge shall have a defined detection
    or resolution mechanism.
  criticality: material
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-DRA-001
  capability_id: DAT-04
  title: Data Provenance
  normative_level: SHALL
  statement: Material data sources shall have traceable provenance.
  criticality: material
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-DRA-002
  capability_id: DAT-04
  title: Usage Restrictions
  normative_level: SHALL
  statement: Applicable licensing, contractual, legal, or policy restrictions on material
    data use shall be recorded.
  criticality: critical
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-DRA-003
  capability_id: DAT-04
  title: Downstream Exposure
  normative_level: SHALL
  statement: Material downstream model or provider exposure of data shall be understood
    and recorded.
  criticality: material
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-DRA-004
  capability_id: DAT-04
  title: Sensitive Reuse Approval
  normative_level: SHALL
  statement: Material reuse of sensitive data outside its approved purpose shall require
    explicit authorization.
  criticality: critical
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-DRA-005
  capability_id: DAT-04
  title: Retention and Deletion
  normative_level: SHALL
  statement: Applicable retention and deletion obligations shall be implemented through
    lifecycle controls.
  criticality: critical
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-ARC-001
  capability_id: TEC-01
  title: Architecture Record
  normative_level: SHALL
  statement: Material AI systems shall maintain an architecture record appropriate
    to their complexity and impact.
  criticality: material
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-ARC-002
  capability_id: TEC-01
  title: System Boundaries
  normative_level: SHALL
  statement: Material system boundaries and major data or control flows shall be defined.
  criticality: material
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-ARC-003
  capability_id: TEC-01
  title: Critical Dependencies
  normative_level: SHALL
  statement: Critical internal and external technical dependencies shall be traceable.
  criticality: critical
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-ARC-004
  capability_id: TEC-01
  title: Architecture Rationale
  normative_level: SHOULD
  statement: Material architecture decisions should retain rationale for significant
    trade-offs.
  criticality: normal
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-ARC-005
  capability_id: TEC-01
  title: Failure Boundaries
  normative_level: SHALL
  statement: High-impact AI systems shall define failure, isolation, or containment
    boundaries appropriate to their risk.
  criticality: critical
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-ARC-006
  capability_id: TEC-01
  title: Architecture Conformance
  normative_level: SHALL
  statement: Material differences between approved architecture and production implementation
    shall be detected and reviewed.
  criticality: material
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-MSP-001
  capability_id: TEC-02
  title: Sourcing Profile
  normative_level: SHALL
  statement: Each material AI system shall declare its model and system sourcing profile.
  criticality: material
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-MSP-002
  capability_id: TEC-02
  title: Provider Dependency
  normative_level: SHALL
  statement: Material external model and service providers shall be identified.
  criticality: material
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-MSP-003
  capability_id: TEC-02
  title: Floating Dependency Flag
  normative_level: SHALL
  statement: Floating model identifiers or unpinned dependencies shall be explicitly
    flagged.
  criticality: material
  machine_verifiability: MV1
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-MSP-004
  capability_id: TEC-02
  title: Provider Change Re-evaluation
  normative_level: SHALL
  statement: Material provider or model changes shall trigger evaluation appropriate
    to the affected system.
  criticality: critical
  machine_verifiability: MV2
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-MSP-005
  capability_id: TEC-02
  title: Fallback or Exit Strategy
  normative_level: SHOULD
  statement: Material externally dependent AI systems should maintain a proportionate
    fallback or exit strategy.
  criticality: normal
  machine_verifiability: MV3
  introduced_in: 1.0.0
  status: stable_candidate
- requirement_id: EAIMS-MSP-006
