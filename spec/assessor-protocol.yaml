    INSUFFICIENT_EVIDENCE: The requirement is applicable but available evidence is
      insufficient or materially conflicted.
    NOT_APPLICABLE: Applicability is explicitly justified by assessment context; absence
      of evidence alone is not sufficient.
  independence_note: Assessor role and relationship to the assessed control must be
    recorded; independence affects assessment quality, not maturity directly.
