  - governance_record
  - decision_record
  required_record_fields:
  - assessor_id
  - decision
  - rationale
  - evidence_refs
  - assessed_at
  allowed_decisions:
  - SATISFIED
  - NOT_SATISFIED
  - INSUFFICIENT_EVIDENCE
  - NOT_APPLICABLE
  decision_rules:
    SATISFIED: Relevant evidence is available and the assessor documents why it demonstrates
      the requirement in the assessed context.
    NOT_SATISFIED: Relevant evidence or direct observation demonstrates that the requirement
      is not met.
    INSUFFICIENT_EVIDENCE: The requirement is applicable but available evidence is
      insufficient or materially conflicted.
    NOT_APPLICABLE: Applicability is explicitly justified by assessment context; absence
      of evidence alone is not sufficient.
  independence_note: Assessor role and relationship to the assessed control must be
    recorded; independence affects assessment quality, not maturity directly.
