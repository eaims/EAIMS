result_semantics:
  PASS: Applicable control is adequately demonstrated.
  BREACH: Requirement is applicable and demonstrably not satisfied.
  INCOMPLETE: Evidence is insufficient to establish pass or breach.
  NOT_APPLICABLE: Gate is not activated for the assessed context.
effects:
- critical_risk_flag
- maturity_cap
- scale_block
- deployment_block
- mandatory_remediation
- reassessment_required
exception_rule: An approved exception does not convert a BREACH to PASS.
inheritance_rule: A system activates all applicable lower and higher gate families;
  higher families do not replace lower ones.
