- capability_id: STR-04
  anchor_statement_refs:
    L1: AI funding is primarily technology-led or opportunistic.
    L2: Business cases exist for selected initiatives, but investment criteria and
      continuation decisions are inconsistent.
    L3: Material AI investments are evaluated against defined strategic fit, expected
      value, risk, feasibility, dependencies, and ownership.
    L4: Continued funding and portfolio allocation are systematically informed by
      milestones, realized outcomes, cost, risk, and delivery evidence.
    L5: Capital and organizational capacity are continuously reallocated toward the
      highest risk-adjusted AI value, while underperforming initiatives are stopped,
      redesigned, or reduced.
