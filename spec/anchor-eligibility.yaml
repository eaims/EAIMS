- capability_id: DAT-01
  anchor_statement_refs:
    L1: Data ownership, usage authority, and AI-relevant dependencies are largely
      implicit.
    L2: Owners and access rules exist for selected critical datasets, but coverage
      and lineage are incomplete.
    L3: Material AI data assets have defined ownership, access authority, provenance,
      key dependencies, and governance responsibilities.
    L4: Data governance effectiveness is measured through access exceptions, lineage
      coverage, incidents, usage violations, and remediation performance.
    L5: Data governance continuously adapts to changing AI use, new data sources,
      emerging risks, regulatory requirements, and observed operational failures.
