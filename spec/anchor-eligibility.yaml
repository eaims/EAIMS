- capability_id: STR-03
  anchor_statement_refs:
    L1: No coherent target maturity or transformation roadmap exists.
    L2: Major improvement initiatives are identified, but target states, dependencies,
      ownership, or sequencing are incomplete.
    L3: Current state, context-appropriate target maturity, target capabilities, dependencies,
      owners, and prioritized roadmap are documented.
    L4: Roadmap delivery is tracked against capability improvement, realized outcomes,
      dependencies, and risk reduction.
    L5: Target maturity and roadmap are dynamically recalibrated as enterprise priorities,
