spec_version: 1.0.0-fc16
status: freeze_candidate_fc16
policy:
  principles:
  - capability_specific_anchor_eligibility
  - cumulative_levels
  - preserve_higher_order_evidence
  - no_hidden_weighting
  - documented_cross_capability_dependencies
  l4_operating_cycles_default: 2
  l5_adaptation_cycles_default: 1
  note: Operating-cycle counts are design defaults for FC16 and remain provisional
    pending empirical calibration.
capabilities:
- capability_id: STR-01
  anchor_statement_refs:
    L1: AI initiatives largely emerge opportunistically, with limited connection to
      documented enterprise priorities.
    L2: Selected AI initiatives are linked to business priorities, but strategic criteria
      are inconsistent across the portfolio.
    L3: The organization maintains a documented AI strategy linked to enterprise objectives,
      business outcomes, major dependencies, and material risks.
    L4: Strategic AI progress is reviewed against measurable business outcomes, investment
      performance, capability constraints, and material risks.
    L5: The AI strategy and target state are systematically revised using realized
      value, emerging risk, organizational learning, market change, and technology
      evolution.
  requirement_minimum_levels:
    EAIMS-STR-001: L2
    EAIMS-STR-002: L3
    EAIMS-STR-004: L4
    EAIMS-STR-005: L3
  levels:
    L1:
      minimum_evidence_class: null
      minimum_operating_cycles: 0
      minimum_adaptation_cycles: 0
      required_requirements: []
      max_unresolved_counter_evidence: critical
    L2:
      minimum_evidence_class: E1
      minimum_operating_cycles: 0
      minimum_adaptation_cycles: 0
      required_requirements:
      - EAIMS-STR-001
      max_unresolved_counter_evidence: critical
    L3:
      minimum_evidence_class: E2
      minimum_operating_cycles: 0
      minimum_adaptation_cycles: 0
      required_requirements:
      - EAIMS-STR-001
      - EAIMS-STR-002
      - EAIMS-STR-005
      max_unresolved_counter_evidence: material
    L4:
      minimum_evidence_class: E3
      minimum_operating_cycles: 2
      minimum_adaptation_cycles: 0
      required_requirements:
      - EAIMS-STR-001
      - EAIMS-STR-002
      - EAIMS-STR-004
      - EAIMS-STR-005
      max_unresolved_counter_evidence: minor
    L5:
      minimum_evidence_class: E4
      minimum_operating_cycles: 2
      minimum_adaptation_cycles: 1
      required_requirements:
