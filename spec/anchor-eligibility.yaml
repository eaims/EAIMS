    L3: The organization uses a repeatable process to identify business problems and
      determine whether AI is an appropriate solution.
    L4: Opportunity generation and qualification are informed by business outcomes,
      process data, strategic priorities, feasibility, risk, and prior portfolio evidence.
    L5: The opportunity pipeline continuously evolves using realized portfolio outcomes,
