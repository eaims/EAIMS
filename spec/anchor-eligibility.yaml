- capability_id: VAL-03
  anchor_statement_refs:
    L1: Experiments and pilots lack consistent success, stop, or scale criteria.
    L2: Selected pilots have business objectives and owners, but evidence requirements
      and scale decisions vary.
    L3: Material pilots have documented hypotheses, baseline measures, success criteria,
      owners, risk classification, autonomy/HAB requirements, and explicit scale/stop
      criteria.
    L4: Pilot decisions are evidence-backed and consistently result in SCALE, EXTEND,
      REDESIGN, HOLD, or STOP outcomes with traceable rationale.
    L5: Pilot design and scale criteria continuously improve based on portfolio learning,
      failed experiments, realized value, operational risk, and organizational capacity.
